nical RTO 14 s</text><text x="80" y="668" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">Seed by metadata-log replay silently missed 72-78% of existing objects -&gt; seed must be a snapshot and must be proven with a listing/ETag diff (s3-reconcile)</text><text x="80" y="696" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">Failback: replay DR-era changes only (fromTsMs = failover - margin), reconcile primary-only tail writes (RPO window) before mirror deletes resume</text></svg>