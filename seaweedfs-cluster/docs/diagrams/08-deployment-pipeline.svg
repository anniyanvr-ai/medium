, gates re-checked</text><text x="50" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- stop order = reverse phases</text><rect x="620" y="400" width="940" height="90" rx="12" fill="#fff" stroke="#b3261e" stroke-width="2"/><text x="634" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b3261e" font-weight="bold" text-anchor="start">Promote only when</text><text x="640" y="446" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">validate: 0 FAIL   |   e2e: 0 FAIL, every FINDING has an owner   |   Enterprise-only tests (F01, DM) passed on staging</text></svg>