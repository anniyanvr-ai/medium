t-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">bucket, landing, tiering</text><line x1="990" y1="125" x2="1010" y2="125" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="1206" y="80" width="176" height="90" rx="8" fill="#e7f5f2" stroke="#0f7b6c" stroke-width="1.5"/><text x="1294.0" y="122.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#0f7b6c" font-weight="bold" text-anchor="middle">deploy --phase sync</text><text x="1294.0" y="139.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">DR replication last</text><line x1="1186" y1="125" x2="1206" y2="125" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="1402" y="80" width="176" height="90" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/><text x="1490.0" y="122.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="bold" text-anchor="middle">e2e_test.py</text><text x="1490.0" y="139.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">38 acceptance tests</text><line x1="1382" y1="125" x2="1402" y2="125" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="620" y="220" width="940" height="150" rx="12" fill="#fff" stroke="#2b6f3e" stroke-width="2"/><text x="634" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2b6f3e" font-weight="bold" text-anchor="start">swctl deploy - each phase must pass its gate before the next starts</text><rect x="640" y="262" width="138" height="80" rx="8" fill="#fff" stroke="#6b3fa0" stroke-width="1.5"/><text x="709.0" y="299.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b3fa0" font-weight="bold" text-anchor="middle">master</text><text x="709.0" y="316.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">Raft leader + all peers</text><rect x="792" y="262" width="138" height="80" rx="8" fill="#fff" stroke="#c2571a" stroke-width="1.5"/><text x="861.0" y="299.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#c2571a" font-weight="bold" text-anchor="middle">volume</text><text x="861.0" y="316.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">DC / rack / disk</text><line x1="778" y1="302" x2="792" y2="302" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="944" y="262" width="138" height="80" rx="8" fill="#fff" stroke="#1f5fa8" stroke-width="1.5"/><text x="1013.0" y="299.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f5fa8" font-weight="bold" text-anchor="middle">filer</text><text x="1013.0" y="316.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">one at a time</text><line x1="930" y1="302" x2="944" y2="302" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="1096" y="262" width="138" height="80" rx="8" fill="#fff" stroke="#2b6f3e" stroke-width="1.5"/><text x="1165.0" y="299.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2b6f3e" font-weight="bold" text-anchor="middle">s3</text><text x="1165.0" y="316.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">/healthz on all</text><line x1="1082" y1="302" x2="1096" y2="302" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="1248" y="262" width="138" height="80" rx="8" fill="#fff" stroke="#6b3fa0" stroke-width="1.5"/><text x="1317.0" y="299.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b3fa0" font-weight="bold" text-anchor="middle">admin</text><text x="1317.0" y="316.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="norm