<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560"><defs><marker id="a856775" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="a856775s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker></defs><defs><marker id="a509164" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4f8a"/></marker><marker id="a509164s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d4f8a"/></marker></defs><defs><marker id="a722964" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b6f3e"/></marker><marker id="a722964s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2b6f3e"/></marker></defs><rect width="1600" height="560" fill="#ffffff"/><text x="24" y="38" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">4. Data lifecycle - Enterprise Volume Tiering (demotion-only ladder)</text><rect x="40" y="90" width="260" height="110" rx="8" fill="#eaf5ec" stroke="#2b6f3e" stroke-width="1.5"/><text x="170.0" y="134.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#2b6f3e" font-weight="bold" text-anchor="middle">S3 PUT</text><text x="170.0" y="151.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">server-side classification</text><text x="170.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">selector ** -&gt; class archive-data</text><rect x="380" y="90" width="330" height="110" rx="8" fill="#fdf0e6" stroke="#c2571a" stroke-width="1.5"/><text x="545.0" y="134.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#c2571a" font-weight="bold" text-anchor="middle">Tier 0 - LANDING</text><text x="545.0" y="151.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">SSD / NVMe, replicated 010</text><text x="545.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">2 copies in 2 racks, writable volumes</text><rect x="820" y="90" width="330" height="110" rx="8" fill="#eceffa" stroke="#3d4f8a" stroke-width="1.5"/><text x="985.0" y="134.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#3d4f8a" font-weight="bold" text-anchor="middle">Tier 1 - cold-ec</text><text x="985.0" y="151.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">HDD, erasure coded k+m</text><text x="985.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">read-only, ~1.4x overhead (10+4)</text><rect x="1260" y="90" width="300" height="110" rx="8" fill="#f5f7fa" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1410.0" y="134.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#5f6b7a" font-weight="bold" text-anchor="middle">(optional) Tier 2</text><text x="1410.0" y="151.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">remote / object-lock backend</text><text x="1410.0" y="168.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">[storage.backend] in master.toml</text><line x1="300" y1="145" x2="380" y2="145" stroke="#2b6f3e" stroke-width="1.8" marker-end="url(#a722964)"/><line x1="710" y1="145" x2="820" y2="145" stroke="#3d4f8a" stroke-width="3" marker-end="url(#a509164)"/><text x="765" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#3d4f8a" font-weight="bold" text-anchor="middle">quietForSeconds</text><text x="765" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#3d4f8a" font-weight="normal" text-anchor="middle">7,776,000 (90 d)</text><line x1="1150" y1="145" x2="1260" y2="145" stroke="#5f6b7a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a856775)"/><path d="M 985 200 C 985 270, 545 270, 545 205" fill="none" stroke="#5f6b7a" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#a856775)"/><text x="765" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="middle" font-style="italic">promotion = operator action only (ec.decode / volume.tier.move)</text><rect x="40" y="300" width="700" height="230" rx="12" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="54" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">How 'age' is measured (per VOLUME, not per object)</text><text x="60" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- Replicated volume: newest ModifiedAtSecond across its replicas.</text><text x="60" y="379" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- One late write into a volume restarts its 90-day clock.</text><text x="60" y="413" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- EC volume: time since last (re)encode - EC vacuum resets it.</text><text x="60" y="447" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">- Objects written on DR by Data Movement are NEW writes there:</text><text x="60" y="481" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">- the DR seed sits on DR SSD for 90 days unless the DR profile differs.</text><rect x="780" y="300" width="780" height="230" rx="12" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="794" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Guard rails to configure</text><text x="800" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- pressure rule on ssd: high 80% -&gt; demote coldest volumes to 70%</text><text x="800" y="379" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- never EC or remote-tier the metadata class</text><text x="800" y="413" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- worker pool on dedicated disks (-workingDir) - EC staging needs space</text><text x="800" y="447" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- enable ec_vacuum for delete-heavy collections</text><text x="800" y="481" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- test with a 300 s profile on a TEST collection before 7,776,000 s</text></svg>