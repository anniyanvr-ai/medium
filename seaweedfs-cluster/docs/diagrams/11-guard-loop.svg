<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><defs><marker id="a856775" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="a856775s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker></defs><rect width="1600" height="650" fill="#ffffff"/><text x="24" y="38" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#1f2933" font-weight="bold" text-anchor="start">11. sw-guard remediation loop (every 5 min on each admin host)</text><rect x="40" y="90" width="270" height="90" rx="8" fill="#fff" stroke="#0f7b6c" stroke-width="1.5"/><text x="175.0" y="124.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#0f7b6c" font-weight="bold" text-anchor="middle">1 canary</text><text x="175.0" y="141.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">PUT _canary/... on Primary</text><text x="175.0" y="158.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">GET on DR within RPO</text><rect x="350" y="90" width="270" height="90" rx="8" fill="#fff" stroke="#6b3fa0" stroke-width="1.5"/><text x="485.0" y="124.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#6b3fa0" font-weight="bold" text-anchor="middle">2 diagnose</text><text x="485.0" y="141.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">policy phase, job owner,</text><text x="485.0" y="158.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">worker liveness</text><line x1="310" y1="135" x2="350" y2="135" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="660" y="90" width="270" height="90" rx="8" fill="#fff" stroke="#b3261e" stroke-width="1.5"/><text x="795.0" y="124.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#b3261e" font-weight="bold" text-anchor="middle">3 heal</text><text x="795.0" y="141.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">expire orphaned job + detect;</text><text x="795.0" y="158.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">then restart admin+workers</text><line x1="620" y1="135" x2="660" y2="135" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="970" y="90" width="270" height="90" rx="8" fill="#fff" stroke="#0f7b6c" stroke-width="1.5"/><text x="1105.0" y="124.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#0f7b6c" font-weight="bold" text-anchor="middle">4 re-check</text><text x="1105.0" y="141.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">canary must pass</text><text x="1105.0" y="158.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">(&lt;= 15 min budget)</text><line x1="930" y1="135" x2="970" y2="135" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><rect x="1280" y="90" width="270" height="90" rx="8" fill="#fff" stroke="#2b6f3e" stroke-width="1.5"/><text x="1415.0" y="124.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#2b6f3e" font-weight="bold" text-anchor="middle">5 reconcile</text><text x="1415.0" y="141.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">s3-reconcile --since last good</text><text x="1415.0" y="158.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="middle">--copy-missing (HEAD mode)</text><line x1="1240" y1="135" x2="1280" y2="135" stroke="#5f6b7a" stroke-width="1.8" marker-end="url(#a856775)"/><text x="175" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2b6f3e" font-weight="normal" text-anchor="middle">if it passes: record 'last good' time, exit 0</text><rect x="40" y="260" width="1520" height="330" rx="12" fill="#f5f7fa" stroke="#1f2933" stroke-width="2"/><text x="54" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">Other checks in the same run</text><text x="70" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">tier  (E-03)</text><text x="280" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">EC set complete but replicated copy still on SSD</text><text x="1000" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">-&gt; lock; volume.delete leftover; verify</text><text x="70" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">class (E-02)</text><text x="280" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">volumes of a tiered collection without class</text><text x="1000" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">-&gt; report (never demoted)</text><text x="70" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">layout (E-07)</text><text x="280" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">master writable list has EC'd / missing volume ids</text><text x="1000" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">-&gt; rolling master restart, leader last</text><text x="70" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">dm    (E-10)</text><text x="280" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">enabled policy without a running job</text><text x="1000" y="444" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">-&gt; expire + detection, then restart ladder</text><text x="70" y="488" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">sweep (E-13)</text><text x="280" y="488" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">objects since last sweep missing on DR (HEAD)</text><text x="1000" y="488" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">-&gt; copy what Data Movement skipped</text><text x="70" y="532" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">capacity (E-12)</text><text x="280" y="532" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#5f6b7a" font-weight="normal" text-anchor="start">free volume slots per tier / rack</text><text x="1000" y="532" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b3261e" font-weight="normal" text-anchor="start">-&gt; page before the hot tier is full</text><text x="800" y="620" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="middle">exit 0 = healthy, 2 = problem left (page); --json for monitoring; every fix re-checked before it is reported</text></svg>