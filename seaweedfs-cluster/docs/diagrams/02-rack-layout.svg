<rect x="860" y="494" width="330" height="76" rx="8" fill="#eceffa" stroke="#3d4f8a" stroke-width="1.5"/><text x="1025.0" y="529.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#3d4f8a" font-weight="bold" text-anchor="middle">primary-cold-03  10.10.20.13</text><text x="1025.0" y="546.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#5f6b7a" font-weight="normal" text-anchor="middle">volume hdd :8081 / 18081 / m9326</text><rect x="1250" y="70" width="330" height="640" rx="12" fill="#fff" stroke="#1f2933" stroke-width="2"/><text x="1264" y="92" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="start">What each failure costs</text><text x="1268" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">1 S3 gateway</text><text x="1268" y="138" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2b6f3e" font-weight="normal" text-anchor="start">none - F5 drains it</text><text x="1268" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">1 filer</text><text x="1268" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1f5fa8" font-weight="normal" text-anchor="start">none - S3 uses other 2</text><text x="1268" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">1 master (incl. leader)</text><text x="1268" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b3fa0" font-weight="normal" text-anchor="start">none - re-election ~2-5s</text><text x="1268" y="334" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">1 hot node</text><text x="1268" y="354" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#c2571a" font-weight="normal" text-anchor="start">none - replica in other rack</text><text x="1268" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">1 cold node, EC 10+4</text><text x="1268" y="426" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b3261e" font-weight="normal" text-anchor="start">EC DATA UNREADABLE (5 &gt; 4)</text><text x="1268" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">whole rack</text><text x="1268" y="498" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b3261e" font-weight="normal" text-anchor="start">hot OK; cold EC unreadable</text><text x="1268" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">admin host</text><text x="1268" y="570" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b3fa0" font-weight="normal" text-anchor="start">tiering/DM paused, no data loss</text><text x="1268" y="622" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">DC</text><text x="1268" y="642" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0f7b6c" font-weight="normal" text-anchor="start">GSLB -&gt; DR (RPO = DM lag)</text><text x="40" y="750" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="start">Ports shown as HTTP / gRPC / metrics. gRPC is always HTTP+10000; metrics ports are in the 9324-9331 block so they can never collide with gRPC (v1.0 defect).</text><text x="40" y="772" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#5f6b7a" font-weight="normal" text-anchor="start">Every role is rack-labelled (-rack=rN, -dataCenter=dc1) so replica and shard placement follows the physical failure domains.</text></svg>