# Business inputs - the capacity model in `swctl validate` is driven by these
sla:
  rpo_seconds: 60                # approved RPO; = canary deadline (lab: DC-loss RPO 0.07 s, lag p50 0.21 s)
  rto_minutes: 15
  daily_files: 1000000           # "more than a million files per day"
  avg_file_kb: 256               # ASSUMPTION - replace with the measured average object size
  retention_days: 365
  peak_factor: 10                # peak-hour rate / average rate
  daily_downloads: 1000000
