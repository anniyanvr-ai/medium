# =============================================================================
# SeaweedFS Enterprise - v2.2 production architecture for 1M+ files/day (Primary DC1 + DR DC2)
# Changes vs production.yaml (v2.1 baseline) come from the lab findings - see design doc v2.2 sec. 11/12:
#   shared HA metadata store (postgres2) | EC 6+3 on 2 cold nodes per rack | 2 hot nodes per rack sized
#   for 90 d | dedicated Data Movement worker hosts | tuned DM timeouts | canary + sw-guard monitoring
# Single source of truth for swctl: validate -> render -> deploy -> verify.
# Replace placeholder IPs / hostnames with the real node inventory.
# =============================================================================
global:
  edition: enterprise            # enterprise | oss  (oss skips tiering/data-movement)
  weed_binary: /opt/seaweedfs/weed
  weed_version: "4.48"           # pin; upgrade deliberately (see runbook)
  license_file: /etc/seaweedfs/seaweed-license.json
  config_dir: /etc/seaweedfs
  data_root: /data/seaweed       # master mdir, filer store, admin, worker state
  run_user: seaweedfs
  transport: ssh                 # ssh | local
  runtime: systemd               # systemd | local
  ssh:
    user: deploy
    options: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
    sudo: true

  # --- Port plan (fixes v1.0 collisions: metrics must NOT equal port+10000) --
  ports:
    master:      {http: 9333,  metrics: 9324}      # gRPC = 19333
    volume_hot:  {http: 8080,  metrics: 9325}      # gRPC = 18080
    volume_cold: {http: 8081,  metrics: 9326}      # gRPC = 18081
    filer:       {http: 8888,  metrics: 9327}      # gRPC = 18888
    s3:          {http: 8333,  metrics: 9328}      # gRPC = 18333
    admin:       {http: 23646, metrics: 9329}      # gRPC = 33646
    worker:      {metrics_base: 9330}              # worker N -> 9330+N-1

  master:
    volume_size_limit_mb: 30000
    default_replication: "010"
    raft_hashicorp: false
  volume:
    index: leveldb               # memory|leveldb ; leveldb bounds RAM for many small files
    min_free_space: "5"          # percent; volumes go read-only below this
    compaction_mbps: 50
    volume_size_gb: 30           # must match master.volume_size_limit_mb / 1000
  filer:
    # 1M files/day x 365 d = ~380M entries: beyond leveldb2 (full copy per filer, peer-synced).
    # One HA PostgreSQL per DC (Patroni + VIP, sync replica in another rack); hostname per cluster below.
    store: postgres2
    postgres2: {port: 5432, database: seaweedfs, username: seaweedfs, password_env: SW_PG_PASSWORD,
                sslmode: verify-full, sslrootcert: /etc/ssl/certs/pg-ca.crt, max_open: 100, max_idle: 50}
  s3:
    buckets: [archive]
    identities:
      - name: archive-app
        access_key: archive_app
        secret_env: SW_S3_ARCHIVE_APP_SECRET   # never commit secrets; injected from vault/env
        actions: ["Read:archive", "Write:archive", "List:archive", "Tagging:archive"]
      - name: monitor
        access_key: monitor_probe
        secret_env: SW_S3_MONITOR_SECRET
        actions: ["Read:archive", "List:archive"]
      - name: admin
        access_key: sw_admin
        secret_env: SW_S3_ADMIN_SECRET
        actions: ["Admin"]
  security:
    grpc_mtls: true              # per-node certs signed by a SeaweedFS-internal CA
    jwt_signing: true            # volume write authorization
    https: false                 # TLS terminated on F5; enable for end-to-end TLS
    pki_dir: pki                 # relative to build dir; use your enterprise CA in prod
  tiering:
    hot_disk: ssd
    cold_disk: hdd
    quiet_for_seconds: 7776000   # 90 days
    ec: {data_shards: 6, parity_shards: 3}   # 3 racks: max 3 shards/rack = parity -> survives a rack loss
                                             # (10+4 needs >= 4 racks; it failed node loss in the lab, X04)
    ssd_pressure: {high_watermark: 0.80, low_watermark: 0.70}
  workers: {count: 2, job_types: "all"}     # per worker host; workers live on dedicated hosts (not the admin)
  data_movement_tuning:                     # applied by `swctl dm enable` (lab finding E-08)
    slice_max_runtime_seconds: 600          # job re-proposed every 10 min -> bounded checkpoint age
    execution_timeout_seconds: 900          # admin reaps a job whose worker died within 15 min
    job_type_max_runtime_seconds: 900
  monitoring:
    canary: {interval_s: 60, rpo_s: 60, listen_port: 9340}          # sw-canary daemon on each admin host
    guard:  {schedule: "*/5 * * * *", fix: true, sweep: true, date_layout: "ingest/%Y/%m/%d/"}   # sw-guard timer

