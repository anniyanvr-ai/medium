# Generated by swctl - shared metadata store for all filers of this cluster
[postgres2]
enabled = true
createTable = """
  CREATE TABLE IF NOT EXISTS "%s" (
    dirhash   BIGINT,
    name      VARCHAR(65535),
    directory VARCHAR(65535),
    meta      bytea,
    PRIMARY KEY (dirhash, name)
  );
"""
hostname = "pg-dr.company.com"
port = 5432
username = "seaweedfs"
password = "__SW_PG_PASSWORD_FROM_VAULT__"
database = "seaweedfs"
schema = ""
sslmode = "verify-full"
connection_max_idle = 50
connection_max_open = 100
connection_max_lifetime_seconds = 300
pgbouncer_compatible = false
enableUpsert = true
upsertQuery = """
  INSERT INTO "%[1]s" (dirhash, name, directory, meta)
    VALUES($1, $2, $3, $4)
    ON CONFLICT (dirhash, name) DO UPDATE SET
      directory=EXCLUDED.directory,
      meta=EXCLUDED.meta
"""
sslrootcert = "/etc/ssl/certs/pg-ca.crt"
